<!doctype html><html lang=en><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>GIF Animation Editor</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0e0f12;color:#f5f2ee;font:16px 'Segoe UI',sans-serif}main{max-width:1180px;margin:auto;padding:34px 28px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2e2e32;padding-bottom:20px;margin-bottom:28px}h1{font-size:31px;margin:0;letter-spacing:-1px}small{color:#e7a889;font-weight:700;letter-spacing:2px}section{display:grid;grid-template-columns:minmax(0,2fr) minmax(244px,1fr);gap:20px}article,aside{background:#17181c;border:1px solid #303037;border-radius:14px;padding:20px}#stage{min-height:350px;background:#08090b;display:grid;place-items:center;border:1px dashed #3c3c42;border-radius:9px;overflow:hidden}canvas{display:block;max-width:100%;max-height:56vh;object-fit:contain}.file{margin-top:13px;color:#bbb}#info{display:flex;justify-content:space-between;gap:10px;margin-top:16px;overflow-wrap:anywhere}#meta,p{color:#b9b7bc}h2{margin:0 0 23px}label{display:block;margin:18px 0 8px}select,button{font:inherit;width:100%;padding:12px;border-radius:7px;border:1px solid #424047;background:#222329;color:white}input[type=range]{width:100%;accent-color:#ff713c}button{background:#ff723e;color:#17100c;border:0;font-weight:800;cursor:pointer;margin-top:13px}button:disabled{opacity:.5}#status{min-height:22px}@media(max-width:720px){section{grid-template-columns:1fr}#stage{min-height:240px}}
.trim{display:flex;gap:14px}.trim input{width:100%;margin-top:6px;padding:8px;color:white;background:#222329;border:1px solid #424047;border-radius:5px}.transport{display:flex;gap:8px}.transport button{background:#26272c;color:#f5f2ee;border:1px solid #41414a;padding:9px;font-size:.85rem}.timeline{display:flex;justify-content:space-between}</style><main><header><h1>GIF Animation Editor</h1></header><section>
<article><div id=stage><canvas id=preview aria-label="Animation preview"></canvas></div><label class=timeline for=playhead>Frame <output id=frame></output></label><input type=range id=playhead min=1 value=1><div class=transport><button id=previous>Previous frame</button><button id=play>Play / Pause</button><button id=next>Next frame</button></div><div id=info><strong id=name>Loading sample</strong><span id=meta></span></div><label for=file>Open an image or drag it onto the preview</label><input class=file id=file type=file accept="image/gif,image/png,image/jpeg,image/webp"></article>
<aside><h2>Effects</h2><label for=effect>Preset</label><select id=effect><option value=none>Original</option><option value=fire>Fire &amp; Embers</option><option value=chrome>High-contrast chrome</option><option value=pulse>Zoom pulse</option><option value=shake>Shake</option></select>
<label for=power>Intensity</label><input type=range id=power min=0 max=100 value=65><label for=speed>Speed</label><input type=range id=speed min=.25 max=2 step=.05 value=1><label><input type=checkbox id=pause> Pause preview</label><div class=trim><label>Start frame <input id=first type=number min=1></label><label>End frame <input id=last type=number min=1></label></div><label><input type=checkbox id=reverse> Reverse frames</label><label><input type=checkbox id=still> Animate a single selected frame</label><button id=export>Export GIF</button><p id=status role=status></p></aside>
</section></main><script src="editor.bundle.js"></script>
